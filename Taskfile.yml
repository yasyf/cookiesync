version: '3'

# cookiesync is a Go CLI; `build` compiles every package, `run -- <args>` runs it.

tasks:
  build:
    desc: Compile every package
    cmds:
      - go build ./...

  build-linux:
    desc: Compile every package for the static linux/amd64 release target
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - go build ./...

  run:
    desc: Run the CLI (pass args after --)
    cmds:
      - go run . {{.CLI_ARGS}}

  test:
    desc: Run the Go suite with the race detector, via the process-cap harness
    cmds:
      - ./scripts/test.sh -race -count=1 ./...

  vet:
    desc: Vet the module
    cmds:
      - go vet ./...

  vet-linux:
    desc: Vet the module for linux/amd64
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go vet ./...

  lint:
    desc: Lint with golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format with gofumpt + goimports (via golangci-lint)
    cmds:
      - golangci-lint fmt

  ci:
    desc: Everything CI runs
    cmds:
      - task: vet
      - task: vet-linux
      - task: lint
      - task: test
      - task: build
      - task: build-linux
